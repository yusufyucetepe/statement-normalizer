name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: statements
          POSTGRES_PASSWORD: statements
          POSTGRES_DB: statements_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statements -d statements_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install (locked)
        run: uv sync --frozen --all-extras

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://statements:statements@localhost:5432/statements_test
        run: uv run pytest
