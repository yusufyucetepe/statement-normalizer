services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: statements
      POSTGRES_PASSWORD: statements
      POSTGRES_DB: statements
    ports:
      # Override in .env if the host already runs Postgres: DB_PORT=5433
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statements -d statements"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://statements:statements@db:5432/statements
    ports:
      - "${API_PORT:-8000}:8000"
    # Migrations run on start: this is a single-instance dev setup. A real
    # deployment should run `alembic upgrade head` as a separate release step.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn statement_normalizer.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
